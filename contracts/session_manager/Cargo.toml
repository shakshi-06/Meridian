[package]
name = "session_manager"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "26"

[dev-dependencies]
soroban-sdk = { version = "26", features = ["testutils"] }
node_registry = { path = "../node_registry" }

[features]
testutils = ["soroban-sdk/testutils"]
