[package]
name = "session_manager"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "21.7.0"
node_registry = { path = "../node_registry" }

[dev-dependencies]
soroban-sdk = { version = "21.7.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
